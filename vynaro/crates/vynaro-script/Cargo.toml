[package]
name = "vynaro-script"
version = "1.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Agions"]
repository = "https://github.com/agions/vynaro"
homepage = "https://vynaro.dev"
description = "11 个 LLM Provider + LlmManager 故障切换"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
thiserror = "2"
tracing = "0.1"
futures = "0.3"

[dependencies.vynaro-core]
path = "../vynaro-core"
