[package]
name = "vynaro-domain"
version = "1.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Agions"]
repository = "https://github.com/agions/vynaro"
homepage = "https://vynaro.dev"
description = "领域模型 (Project, MediaFile, Script, Export 等)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
semver = { version = "1", features = ["serde"] }
