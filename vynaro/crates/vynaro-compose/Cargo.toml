[package]
name = "vynaro-compose"
version = "1.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Agions"]
repository = "https://github.com/agions/vynaro"
homepage = "https://vynaro.dev"
description = "7 步流水线状态机 + MonologueMaker"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"

[dependencies.vynaro-core]
path = "../vynaro-core"

[dependencies.vynaro-domain]
path = "../vynaro-domain"

[dependencies.vynaro-script]
path = "../vynaro-script"

[dependencies.vynaro-voice]
path = "../vynaro-voice"

[dependencies.vynaro-detect]
path = "../vynaro-detect"
