[package]
name = "vynaro-storage"
version = "1.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Agions"]
repository = "https://github.com/agions/vynaro"
homepage = "https://vynaro.dev"
description = "素材资产管理: 扫描/元数据抽取/缩略图生成/搜索"

[dependencies]
vynaro-core = { path = "../vynaro-core" }
vynaro-detect = { path = "../vynaro-detect" }
vynaro-domain = { path = "../vynaro-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "2"
walkdir = "2"
mime_guess = "2"
dirs = "5"
sha2 = "0.10"
